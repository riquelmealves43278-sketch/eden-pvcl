name: Build Eden APK (PVCL)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout (somente o zip)
        uses: actions/checkout@v4

      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Descompactar o código do Eden
        run: |
          unzip -q eden.zip
          cd eden
          if grep -q pvcl_enabled src/common/settings.h; then
            echo "O código já contém o PVCL, pulando o patch."
          else
            patch -p1 --batch < ../eden_pvcl.patch
          fi
          grep -q pvcl_enabled src/common/settings.h
          git init -q
          git config user.email "ci@example.com"
          git config user.name "ci"
          git add -A >/dev/null 2>&1
          git commit -q -m "pvcl build" >/dev/null 2>&1 || true

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar NDK e CMake
        run: |
          sdkmanager "ndk;28.2.13676358" "cmake;3.31.5" "platforms;android-36" "build-tools;36.0.0"

      - name: Compilar APK
        working-directory: eden
        run: |
          sh .ci/android/build.sh -t standard -b Release

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: eden-pvcl-apk
          path: eden/artifacts/*
          
