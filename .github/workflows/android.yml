name: Build Eden APK (PVCL)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout (somente o zip)
        uses: actions/checkout@v4

      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Descompactar o código do Eden
        run: |
          unzip -q eden.zip
          cd eden
          if grep -q pvcl_enabled src/common/settings.h; then
            echo "O código já contém o PVCL, pulando o patch."
          else
            patch -p1 --batch < ../eden_pvcl.patch
          fi
          grep -q pvcl_enabled src/common/settings.h
          if [ -f ../eden_pvcl2.patch ]; then
            if grep -q pvcl_safe_mode src/common/settings.h; then
              echo "O código já contém o patch 2, pulando."
            else
              patch -p1 --batch < ../eden_pvcl2.patch
            fi
          fi
          git init -q
          git config user.email "ci@example.com"
          git config user.name "ci"
          git add -A >/dev/null 2>&1
          git commit -q -m "pvcl build" >/dev/null 2>&1 || true

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar NDK e CMake
        run: |
          SDKM=$(ls /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager | tail -1)
          echo "Usando $SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "ndk;28.2.13676358" "cmake;3.31.5" "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar ferramentas de build
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools nasm pkg-config autoconf automake libtool make
          which glslangValidator

      - name: Compilar APK
        working-directory: eden
        run: |
          set -o pipefail
          sh .ci/android/build.sh -t standard -b Release 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Mostrar o erro do CMake/compilador
        if: failure()
        run: |
          echo "=== CMake Error ==="
          grep -n -A15 "CMake Error" build.log | head -120 || true
          echo "=== error: ==="
          grep -n -B2 -A6 "error:" build.log | head -120 || true
          echo "=== FAILED: ==="
          grep -n -A12 "FAILED:" build.log | head -80 || true

      - name: Salvar log completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: eden-pvcl-apk
          path: eden/artifacts/*
